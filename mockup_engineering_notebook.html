<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sổ tay Kỹ sư — Lược đồ Kiến trúc & Đồ thị Tri thức Động</title>
  
  <!-- Phông chữ kỹ thuật chuẩn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Bảng màu: Sổ tay kẻ ca-rô & Mực kỹ thuật */
      --bg-ban-lam-viec: #EBE5DA;
      --bg-giay-caro: #FAF7F0;
      --vien-caro: rgba(44, 48, 56, 0.08);
      --net-muc-chinh: #1A1D24;
      --net-muc-phu: #4B5563;
      --net-muc-mo: #6B7280;
      
      /* Bảng màu nhận diện Icon Vector Kỹ thuật */
      --mau-su-co: #DC2626;
      --mau-su-co-nen: #FEF2F2;
      --mau-tranh-chap: #D97706;
      --mau-tranh-chap-nen: #FFFBEB;
      --mau-khien-khoa: #059669;
      --mau-khien-nen: #ECFDF5;
      --mau-tru-db: #2563EB;
      --mau-tru-nen: #EFF6FF;
      --mau-san-tmdt: #7C3AED;
      --mau-san-nen: #F5F3FF;
      --mau-hang-doi: #0284C7;
      --mau-hang-doi-nen: #E0F2FE;
      --mau-bo-nho-cache: #EA580C;
      --mau-bo-nho-nen: #FFEDD5;

      --do-bong-icon: 2px 3px 0px #1A1D24;
      --do-bong-the: 3px 4px 0px #1A1D24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-ban-lam-viec);
      color: var(--net-muc-chinh);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ========================================================
       KHÔNG GIAN LÀM VIỆC: TOÀN MÀN HÌNH MẶT GIẤY CA-RÔ + DRAWER 520PX
       ======================================================== */
    main.khong-gian-lam-viec {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* Mặt giấy kẻ ca-rô */
    .mat-giay-caro {
      flex: 1;
      background-color: var(--bg-giay-caro);
      background-image: 
        linear-gradient(var(--vien-caro) 1px, transparent 1px),
        linear-gradient(90deg, var(--vien-caro) 1px, transparent 1px);
      background-size: 26px 26px;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    /* ========================================================
       THANH CÔNG CỤ NỔI TRÊN MẶT GIẤY (FLOATING TOOLBAR)
       ======================================================== */
    .thanh-cong-cu-noi {
      position: absolute;
      top: 18px;
      left: 20px;
      z-index: 30;
      background: #FFFFFF;
      border: 2px solid var(--net-muc-chinh);
      border-radius: 8px;
      box-shadow: 3px 3px 0px var(--net-muc-chinh);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 12px;
      user-select: none;
    }

    .nhom-tieu-de-noi {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-so-tay {
      display: flex;
      align-items: center;
      color: var(--net-muc-chinh);
    }

    .chu-tieu-de-noi {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 900;
      color: var(--net-muc-chinh);
      letter-spacing: -0.2px;
    }

    .nhan-dem-node {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      background: #F3F4F6;
      color: #4B5563;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,0.12);
    }

    .vach-ngan-thanh {
      width: 1px;
      height: 20px;
      background: rgba(0, 0, 0, 0.12);
    }

    .nut-thao-tac-noi {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .nut-thao-tac-noi.nut-sinh-node {
      background: #ECFDF5;
      border: 1.5px solid #059669;
      color: #065F46;
    }

    .nut-thao-tac-noi.nut-sinh-node:hover {
      background: #059669;
      color: #FFFFFF;
    }

    .nut-thao-tac-noi.nut-lien-ket {
      background: #F5F3FF;
      border: 1.5px solid var(--mau-san-tmdt);
      color: var(--mau-san-tmdt);
    }

    .nut-thao-tac-noi.nut-lien-ket:hover {
      background: var(--mau-san-tmdt);
      color: #FFFFFF;
    }

    .nut-icon-phu {
      background: #FFFFFF;
      border: 1.5px solid var(--net-muc-chinh);
      border-radius: 6px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--net-muc-chinh);
      transition: all 0.12s ease;
    }

    .nut-icon-phu:hover {
      background: #F3F4F6;
    }

    /* LỚP VẼ ĐƯỜNG NỐI SVG (CHUYỂN ĐỘNG CHẬM, ÊM DỊU) */
    svg.lop-duong-noi {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .duong-noi-day {
      stroke: #1A1D24;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
    }

    .duong-xung-em-ai {
      stroke: #059669;
      stroke-width: 2.2;
      stroke-dasharray: 6 8;
      fill: none;
      animation: dong-chay-cham 4.5s linear infinite;
    }

    .duong-xung-su-co {
      stroke: #DC2626;
      stroke-width: 2.2;
      stroke-dasharray: 6 8;
      fill: none;
      animation: dong-chay-cham 4.5s linear infinite;
    }

    .duong-xung-tmdt {
      stroke: #7C3AED;
      stroke-width: 2.2;
      stroke-dasharray: 6 8;
      fill: none;
      animation: dong-chay-cham 5s linear infinite;
    }

    @keyframes dong-chay-cham {
      from { stroke-dashoffset: 28; }
      to { stroke-dashoffset: 0; }
    }

    .hop-nhan-svg {
      fill: #FFFFFF;
      stroke: #1A1D24;
      stroke-width: 1.5;
      rx: 4px;
    }

    .chu-nhan-svg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 800;
      fill: #1A1D24;
    }

    /* ========================================================
       CÁC NODE DẠNG HUY HIỆU ICON KỸ THUẬT CHUẨN
       ======================================================== */
    .vung-chua-khoi {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    .cum-thuc-the {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .cum-thuc-the.dang-chon .the-nhan-duoi {
      border: 2px solid #059669;
      box-shadow: 3px 4px 0px #059669;
    }

    .cum-thuc-the.dang-chon .hop-icon-pod {
      border-color: #059669;
    }

    /* Vỏ bọc Icon Pod để đính nút mở rộng [+] */
    .hop-icon-pod-wrap {
      position: relative;
      margin-bottom: -14px;
      z-index: 2;
    }

    /* Vòng tròn biểu tượng Icon Pod */
    .hop-icon-pod {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 2.5px solid #1A1D24;
      box-shadow: var(--do-bong-icon);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #FFFFFF;
    }

    /* Nút mở rộng nhánh nhỏ đính trên góc Icon Pod (0 token khi đã khám phá) */
    .nut-mo-rong-pod {
      position: absolute;
      top: -2px;
      right: -2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #1A1D24;
      background: #ECFDF5;
      color: #059669;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 1.5px 1.5px 0px #1A1D24;
      transition: all 0.12s ease;
      z-index: 10;
      line-height: 1;
      padding: 0;
    }

    .nut-mo-rong-pod:hover:not(.da-kham-pha) {
      background: #059669;
      color: #FFFFFF;
      transform: scale(1.12);
    }

    .nut-mo-rong-pod.da-kham-pha {
      background: #E5E7EB;
      color: #059669;
      border-color: #9CA3AF;
      cursor: default;
      transform: none;
      box-shadow: none;
      font-size: 11px;
    }

    .lucide-icon {
      width: 30px;
      height: 30px;
      stroke-width: 2.2;
    }

    .lucide-icon-sm {
      width: 15px;
      height: 15px;
      stroke-width: 2.2;
      vertical-align: middle;
      display: inline-block;
    }

    /* Màu sắc theo từng loại biểu tượng kỹ thuật */
    .hop-icon-pod.su-co {
      background: var(--mau-su-co-nen);
      color: var(--mau-su-co);
    }

    .hop-icon-pod.tranh-chap {
      background: var(--mau-tranh-chap-nen);
      color: var(--mau-tranh-chap);
    }

    .hop-icon-pod.khien {
      background: var(--mau-khien-nen);
      color: var(--mau-khien-khoa);
    }

    .hop-icon-pod.database {
      background: var(--mau-tru-nen);
      color: var(--mau-tru-db);
    }

    .hop-icon-pod.tmdt {
      background: var(--mau-san-nen);
      color: var(--mau-san-tmdt);
    }

    .hop-icon-pod.hang-doi {
      background: var(--mau-hang-doi-nen);
      color: var(--mau-hang-doi);
    }

    .hop-icon-pod.cache {
      background: var(--mau-bo-nho-nen);
      color: var(--mau-bo-nho-cache);
    }

    /* Thẻ nhãn giải thích bên dưới */
    .the-nhan-duoi {
      background: #FFFFFF;
      border: 2px solid #1A1D24;
      border-radius: 8px;
      padding: 18px 14px 10px 14px;
      box-shadow: var(--do-bong-the);
      text-align: center;
      width: 215px;
      z-index: 1;
    }

    .nhan-buoc {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .nhan-tieu-de-khoi {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 13px;
      color: var(--net-muc-chinh);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .nhan-tom-tat {
      font-size: 11px;
      color: var(--net-muc-phu);
      line-height: 1.4;
    }

    /* ========================================================
       TRANG SỔ GHI CHÉP CHI TIẾT (520PX) — TINH GỌN, DÙNG ICON CHUẨN
       ======================================================== */
    aside.trang-so-ghi-chep {
      width: 520px;
      background: #FFFFFF;
      border-left: 2px solid var(--net-muc-chinh);
      display: flex;
      flex-direction: column;
      z-index: 20;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.05);
    }

    .noi-dung-ghi-chep {
      padding: 22px 24px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .dau-trang-chi-tiet {
      border: 2px solid var(--net-muc-chinh);
      background: #FAFAF8;
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: 2px 2px 0px var(--net-muc-chinh);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .dau-trang-ben-trai {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .dau-trang-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid #1A1D24;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .dau-trang-icon svg {
      width: 24px;
      height: 24px;
    }

    .the-phan-loai-dau {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 2px;
      color: var(--net-muc-phu);
    }

    .tieu-de-chi-tiet {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: var(--net-muc-chinh);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Nút mở rộng nhánh trong Drawer Header */
    .nut-mo-rong-drawer {
      background: #ECFDF5;
      color: #065F46;
      border: 1.5px solid #059669;
      border-radius: 6px;
      padding: 6px 11px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 2px 2px 0px #1A1D24;
      transition: all 0.12s ease;
      flex-shrink: 0;
      user-select: none;
    }

    .nut-mo-rong-drawer:hover:not(:disabled) {
      background: #059669;
      color: #FFFFFF;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px #1A1D24;
    }

    .nut-mo-rong-drawer:disabled,
    .nut-mo-rong-drawer.da-kham-pha {
      background: #F3F4F6;
      color: #6B7280;
      border-color: #D1D5DB;
      box-shadow: none;
      cursor: default;
      opacity: 0.9;
      transform: none;
    }

    /* Các khối nội dung có icon chuẩn kỹ thuật */
    .khoi-noi-dung {
      background: #FAFAF8;
      border: 1.5px solid var(--net-muc-chinh);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .tieu-de-khoi {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--net-muc-chinh);
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding-bottom: 6px;
    }

    .tieu-de-khoi svg {
      width: 15px;
      height: 15px;
      stroke-width: 2.2;
    }

    .van-ban-chinh {
      font-size: 12.5px;
      line-height: 1.55;
      color: #2D333B;
    }

    u {
      text-decoration: none;
      border-bottom: 1.5px dashed var(--net-muc-chinh);
      font-weight: 600;
      color: var(--net-muc-chinh);
      cursor: help;
      position: relative;
      display: inline-block;
      transition: all 0.15s ease;
    }

    u:hover {
      background-color: rgba(5, 150, 105, 0.08);
      border-bottom-style: solid;
      border-bottom-color: #059669;
    }

    u[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: #1A1D24;
      color: #FAF7F0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
      padding: 6px 10px;
      border-radius: 5px;
      white-space: normal;
      width: max-content;
      max-width: 250px;
      box-shadow: 2px 3px 0px rgba(0,0,0,0.25);
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, transform 0.15s ease;
      z-index: 100;
      text-align: left;
    }

    u[data-tooltip]::before {
      content: "";
      position: absolute;
      bottom: calc(100% + 1px);
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: #1A1D24;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease;
      z-index: 100;
    }

    u[data-tooltip]:hover::after {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    u[data-tooltip]:hover::before {
      opacity: 1;
      visibility: visible;
    }

    strong {
      font-weight: 800;
    }

    /* Lược đồ hoạt họa SVG */
    .khung-luoc-do-dong {
      background: #FFFFFF;
      border: 1.5px solid var(--net-muc-chinh);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .luoc-do-svg-box {
      width: 100%;
      height: 125px;
      background: #FAF7F0;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .chu-thich-luoc-do {
      font-size: 11.5px;
      color: #4B5563;
      line-height: 1.45;
      background: #F3F4F6;
      padding: 6px 10px;
      border-radius: 4px;
      border-left: 3px solid #059669;
    }

    /* Danh sách chi tiết dùng icon thay vì bullet thô */
    .danh-sach-chi-tiet {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dong-chi-tiet {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 12px;
      line-height: 1.45;
    }

    .dong-chi-tiet svg {
      width: 14px;
      height: 14px;
      stroke-width: 2.2;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .dong-chi-tiet.su-co svg {
      color: #DC2626;
    }

    .dong-chi-tiet.rui-ro svg {
      color: #D97706;
    }

    .chan-trang-thao-tac {
      border-top: 1.5px solid var(--net-muc-chinh);
      padding: 12px 24px;
      background: #FAF7F0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nut-kiem-tra {
      background: var(--net-muc-chinh);
      color: #FFFFFF;
      border: 2px solid var(--net-muc-chinh);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 800;
      padding: 9px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 2px 2px 0px #000;
      transition: all 0.12s ease;
    }

    .nut-kiem-tra:hover {
      background: #059669;
      border-color: #059669;
    }

    /* Khối kiểm tra phản xạ kỹ sư (Reflex Quiz - 0 Token) */
    .khoi-quiz-phan-xa {
      background: #FFFFFF;
      border: 2px solid var(--net-muc-chinh);
      border-radius: 8px;
      padding: 13px 15px;
      box-shadow: 2px 2px 0px var(--net-muc-chinh);
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: hien-thi-quiz 0.2s ease-out;
    }

    @keyframes hien-thi-quiz {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .quiz-cau-hoi {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--net-muc-chinh);
      line-height: 1.45;
    }

    .quiz-danh-sach-lua-chon {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .quiz-lua-chon {
      background: #FAFAF8;
      border: 1.5px solid #D1D5DB;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11.5px;
      color: #374151;
      cursor: pointer;
      transition: all 0.12s ease;
      text-align: left;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quiz-lua-chon:hover:not(:disabled) {
      background: #F3F4F6;
      border-color: #1A1D24;
    }

    .quiz-lua-chon.dung {
      background: #ECFDF5;
      border-color: #059669;
      color: #065F46;
      font-weight: 700;
    }

    .quiz-lua-chon.sai {
      background: #FEF2F2;
      border-color: #DC2626;

    /* ----------------------------------------------------
       5. HÀM RENDER ĐỒ THỊ TRÊN CANVAS
       Tách biệt tuyệt đối:

      const vungChua = document.getElementById("vung-chua-khoi");
      const svgDuong = document.getElementById("svg-duong-noi");
      
      vungChua.innerHTML = "";

      // Cập nhật số đếm node trên Toolbar

      // Render đường nối SVG
      DU_LIEU_DO_THI.edges.forEach((edge) => {
        const pathD = `M ${edge.tu.x} ${edge.tu.y} L ${edge.den.x} ${edge.den.y}`;
        
        const pathDay = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pathDay.setAttribute("class", "duong-noi-day");
        pathDay.setAttribute("d", pathD);
        pathDay.setAttribute("marker-end", "url(#mui-ten-den)");
        svgDuong.appendChild(pathDay);

        const pathXung = document.createElementNS("http://www.w3.org/2000/svg", "path");
        pathXung.setAttribute("class", edge.kieu);
        pathXung.setAttribute("d", pathD);
        svgDuong.appendChild(pathXung);

        const midX = (edge.tu.x + edge.den.x) / 2;
        const midY = (edge.tu.y + edge.den.y) / 2;

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("class", "hop-nhan-svg");
        rect.setAttribute("x", midX - 60);
        rect.setAttribute("y", midY - 11);
        rect.setAttribute("width", 120);
        rect.setAttribute("height", 22);
        svgDuong.appendChild(rect);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("class", "chu-nhan-svg");
        text.setAttribute("x", midX - 52);
        text.setAttribute("y", midY + 4);
        text.textContent = edge.nhan;
        svgDuong.appendChild(text);
      });

      // Render các node bằng Template
      DU_LIEU_DO_THI.nodes.forEach((node) => {
        const templateFn = THU_VIEN_TEMPLATE[node.bieu_tuong] || THU_VIEN_TEMPLATE.khien_bao_ve;
        const htmlIconPod = templateFn(node);
        const daKhamPha = node.fully_explored === true;

        const divCum = document.createElement("div");
        divCum.className = `cum-thuc-the ${node.id === nodeDangChonId ? "dang-chon" : ""}`;

            <div class="nhan-tom-tat">${ganTooltipTuDong(node.tom_tat)}</div>
          </div>
        `;

        // 1. Click vào nút [+]: MỚI gọi mở rộng nhánh (Dừng propagation, KHÔNG mở Drawer)

            return;

          thucHienMoRongNode(node.id);
        });

        // 2. Click vào thân node: 100% CHỈ mở Drawer để đọc chi tiết (0 token, 0 độ trễ)
        divCum.addEventListener("click", () => {
          if (nodeDangChonId === node.id) return;
          nodeDangChonId = node.id;
          document.querySelectorAll(".cum-thuc-the").forEach(el => el.classList.remove("dang-chon"));
          divCum.classList.add("dang-chon");
          renderChiTiet(node);
        });

        vungChua.appendChild(divCum);
      });

      const nodeHienTai = DU_LIEU_DO_THI.nodes.find(n => n.id === nodeDangChonId) || DU_LIEU_DO_THI.nodes[0];

       ---------------------------------------------------- */

        existingQuiz.remove();

      if (!q) return;

        <div class="quiz-danh-sach-lua-chon">
          ${q.lua_chon.map((ans, idx) => `
            <button class="quiz-lua-chon" data-idx="${idx}">
              <span style="font-family:'JetBrains Mono', monospace; font-weight:800; color:var(--net-muc-phu);">${idx === 0 ? 'A.' : 'B.'}</span>
              <span>${ans}</span>
            </button>
          `).join('')}
        </div>
        <div class="quiz-giai-thich" id="quiz-giai-thich" style="display:none;"></div>
      `;

      quizEl.querySelectorAll(".quiz-lua-chon").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.getAttribute("data-idx"));
          const isCorrect = idx === q.dung;
          quizEl.querySelectorAll(".quiz-lua-chon").forEach(b => b.disabled = true);
          if (isCorrect) {
            btn.classList.add("dung");
          } else {
            btn.classList.add("sai");
            const correctBtn = quizEl.querySelector(`.quiz-lua-chon[data-idx="${q.dung}"]`);
            if (correctBtn) correctBtn.classList.add("dung");
          }
          const boxGt = quizEl.querySelector("#quiz-giai-thich");
          boxGt.style.display = "block";
          boxGt.innerHTML = `<strong>${isCorrect ? '✅ Chuẩn xác!' : '⚠️ Cần lưu ý:'}</strong> ${q.giai_thich}`;
        });
      });

      vungNoiDung.appendChild(quizEl);
      quizEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Gắn sự kiện cho nút footer "Kiểm tra kiến thức phản xạ"
    document.getElementById("nut-kiem-tra").addEventListener("click", () => {
      const nodeHienTai = DU_LIEU_DO_THI.nodes.find(n => n.id === nodeDangChonId);
      if (nodeHienTai) {
        batTatQuiz(nodeHienTai);
      }
    });

    // Nút đặt lại về node đầu tiên
    document.getElementById("nut-dat-lai").addEventListener("click", () => {
      if (nodeDangChonId === "node-su-co") return;
      nodeDangChonId = "node-su-co";
      document.querySelectorAll(".cum-thuc-the").forEach(el => el.classList.remove("dang-chon"));
      const firstNodeEl = document.querySelector(".cum-thuc-the");
      if (firstNodeEl) firstNodeEl.classList.add("dang-chon");
      renderChiTiet(DU_LIEU_DO_THI.nodes[0]);
    });

    // Khởi chạy ban đầu
    renderDoThi();
  </script>

</body>
</html>
